<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Günün Dakikası</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --accent: #f0f0f0;
    --muted: #3a3a3a;
    --text: #f0f0f0;
    --dim: #606060;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  /* Glow blob */
  body::after {
    content: '';
    position: fixed;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    animation: pulse 4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
  }

  .container {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 2rem;
  }

  .label {
    font-size: 0.7rem;
    letter-spacing: 0.4em;
    color: var(--dim);
    text-transform: uppercase;
    margin-bottom: 1rem;
  }

  .minute-display {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(7rem, 22vw, 16rem);
    line-height: 0.85;
    color: var(--accent);
    text-shadow:
      0 0 40px rgba(255,255,255,0.2),
      0 0 80px rgba(255,255,255,0.07);
    letter-spacing: -0.02em;
    animation: flicker 8s ease-in-out infinite;
    transition: color 0.3s;
  }

  @keyframes flicker {
    0%, 95%, 100% { opacity: 1; }
    96% { opacity: 0.85; }
    97% { opacity: 1; }
    98% { opacity: 0.9; }
  }

  .suffix {
    font-size: 1rem;
    letter-spacing: 0.25em;
    color: var(--dim);
    margin-top: 0.5rem;
    text-transform: uppercase;
  }

  /* Progress bar */
  .progress-wrap {
    margin-top: 3rem;
    width: min(420px, 90vw);
  }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    color: var(--dim);
    margin-bottom: 0.5rem;
    text-transform: uppercase;
  }

  .progress-track {
    width: 100%;
    height: 3px;
    background: var(--muted);
    position: relative;
    overflow: visible;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    box-shadow: 0 0 12px rgba(255,255,255,0.5);
    transition: width 1s linear;
    position: relative;
  }

  .progress-fill::after {
    content: '';
    position: absolute;
    right: -1px;
    top: 50%;
    transform: translateY(-50%);
    width: 8px;
    height: 8px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 10px rgba(255,255,255,0.8);
  }

  /* Time detail */
  .time-detail {
    margin-top: 3rem;
    display: flex;
    gap: 2rem;
    justify-content: center;
    flex-wrap: wrap;
  }

  .detail-block {
    border: 1px solid var(--muted);
    padding: 0.75rem 1.25rem;
    min-width: 90px;
    position: relative;
  }

  .detail-block::before {
    content: attr(data-label);
    position: absolute;
    top: -0.5em;
    left: 0.75rem;
    background: var(--bg);
    padding: 0 0.35rem;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    color: var(--dim);
    text-transform: uppercase;
  }

  .detail-value {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    color: var(--text);
    letter-spacing: 0.05em;
  }

  /* Tick indicator */
  .tick {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    animation: tick 1s step-end infinite;
  }

  @keyframes tick {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
</style>
</head>
<body>

<div class="container">
  <p class="label">Bugünün</p>
  <div class="minute-display" id="minuteNum">0</div>
  <p class="suffix">. dakikası</p>

  <div class="progress-wrap">
    <div class="progress-meta">
      <span>Gün başlangıcı</span>
      <span id="pctText">0%</span>
      <span>Gece yarısı</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
  </div>

  <div class="time-detail">
    <div class="detail-block" data-label="Saat">
      <div class="detail-value" id="hourVal">--</div>
    </div>
    <div class="detail-block" data-label="Dakika">
      <div class="detail-value" id="minVal">--</div>
    </div>
    <div class="detail-block" data-label="Saniye">
      <div class="detail-value" id="secVal">--</div>
    </div>
    <div class="detail-block" data-label="Kalan">
      <div class="detail-value" id="remVal">--</div>
    </div>
  </div>
</div>

<div class="tick"></div>

<script>
  const TOTAL = 1440;

  function pad(n) { return String(n).padStart(2, '0'); }

  function update() {
    const now = new Date();
    const h = now.getHours();
    const m = now.getMinutes();
    const s = now.getSeconds();

    const minuteOfDay = h * 60 + m;
    const pct = ((minuteOfDay * 60 + s) / (TOTAL * 60)) * 100;
    const remaining = TOTAL - minuteOfDay - (s > 0 ? 1 : 0);

    document.getElementById('minuteNum').textContent = minuteOfDay;
    document.getElementById('progressFill').style.width = pct.toFixed(4) + '%';
    document.getElementById('pctText').textContent = pct.toFixed(2) + '%';
    document.getElementById('hourVal').textContent = pad(h);
    document.getElementById('minVal').textContent = pad(m);
    document.getElementById('secVal').textContent = pad(s);
    document.getElementById('remVal').textContent = remaining;
  }

  update();
  setInterval(update, 1000);
</script>

</body>
</html>
